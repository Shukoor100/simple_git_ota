<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyOTA Wi-Fi Setup</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;padding:16px;display:flex;justify-content:center}
  .card{background:#fff;max-width:380px;width:100%;margin-top:8vh;padding:24px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1)}
  h1{font-size:1.3rem;margin:0 0 4px}
  p{color:#555;font-size:.9rem;margin:0 0 16px}
  label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid #ccc;border-radius:8px}
  button{width:100%;margin-top:20px;padding:12px;font-size:1rem;color:#fff;background:#2563eb;border:0;border-radius:8px}
  button:disabled{background:#93a3c7}
  #msg{margin-top:16px;font-size:.9rem}
  .ok{color:#15803d}.err{color:#b91c1c}
</style>
</head>
<body>
<div class="card">
  <h1>Wi-Fi Setup</h1>
  <p>Enter the Wi-Fi network this device should connect to.</p>
  <form id="f">
    <label for="ssid">Network name (SSID)</label>
    <input id="ssid" name="ssid" maxlength="32" required autocapitalize="none" autocomplete="off">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" maxlength="63" autocomplete="off">
    <button id="b" type="submit">Save</button>
  </form>
  <div id="msg"></div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async function (e) {
  e.preventDefault();
  var b = document.getElementById('b'), m = document.getElementById('msg');
  b.disabled = true; m.className = ''; m.textContent = 'Saving...';
  try {
    var r = await fetch('/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded'},
      body: new URLSearchParams(new FormData(e.target)).toString()
    });
    var t = await r.text();
    m.className = r.ok ? 'ok' : 'err';
    m.textContent = t;
    if (!r.ok) b.disabled = false;
  } catch (x) {
    /* the device may drop the MyOTA network as soon as it connects */
    m.className = 'ok';
    m.textContent = 'Saved. The device is connecting to your Wi-Fi and the MyOTA network will turn off. ' +
                    'If MyOTA reappears, the name or password was wrong - try again.';
  }
});
</script>
</body>
</html>
